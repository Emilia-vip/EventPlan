# Varje PR och varje push testas. Merge till main testas, byggs och driftsätts.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Unit + integration (integration startar Postgres med Testcontainers, Docker finns på ubuntu-runners)
      - run: npm test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build-and-deploy:
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      DOMAIN: ${{ vars.DOMAIN }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      # GHCR kräver små bokstäver i image-namnet, och GitHub-uttryck kan inte göra det
      - name: Sätt image-prefix
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/eventplan" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Bygg och publicera backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Bygg och publicera frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          # Vite bäddar in URL:erna vid bygget
          build-args: |
            VITE_API_URL=https://api.${{ vars.DOMAIN }}
            VITE_CDN_URL=https://cdn.${{ vars.DOMAIN }}/

      - name: Installera kubectl
        uses: azure/setup-kubectl@v4

      - name: Anslut till klustret
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Driftsätt
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          FRONTEND_IMAGE: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          RELEASE: ${{ github.sha }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: ./deploy/deploy.sh
