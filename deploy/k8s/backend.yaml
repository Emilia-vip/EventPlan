apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: eventplan
  labels:
    app: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: backend
  strategy:
    # Zero-downtime: en ny pod startar och blir redo innan en gammal tas bort
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: eventplan-backend
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
          # Ger load balancern tid att sluta skicka trafik innan processen stängs ned
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            # Numeriskt UID (node-imagen använder uid 1000), så kubelet kan verifiera att det inte är root
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # tsx skriver sin cache till /tmp, så den måste vara skrivbar trots read-only rotfilsystem
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: eventplan
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: eventplan
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
---
# Autoscaling: antalet pods ökar/minskar med CPU-belastningen
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: eventplan
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
