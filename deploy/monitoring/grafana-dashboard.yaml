# Färdig Grafana-dashboard: requests/s, svarstid, felandel, antal pods och loggar.
# Grafanas sidecar (kube-prometheus-stack) laddar automatiskt alla ConfigMaps med labeln grafana_dashboard.
# Datakällornas uid (prometheus, loki) sätts i kube-prometheus-stack-values.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eventplan-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  eventplan.json: |
    {
      "uid": "eventplan-overview",
      "title": "EventPlan – översikt",
      "tags": [
        "eventplan"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods som är redo",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(kube_pod_status_ready{namespace=\"eventplan\",pod=~\"backend-.*\",condition=\"true\"} == 1)"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests/s (nu)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_requests_total{namespace=\"eventplan\"}[2m]))"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Felandel (5xx)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_requests_total{namespace=\"eventplan\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{namespace=\"eventplan\"}[5m]))"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Svarstid p95",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"eventplan\"}[5m])))"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests per sekund",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (route) (rate(http_requests_total{namespace=\"eventplan\"}[2m]))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Svarstid (p50 / p95 / p99)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"eventplan\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"eventplan\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"eventplan\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Felandel (5xx i procent av alla anrop)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_requests_total{namespace=\"eventplan\",status=~\"5..\"}[2m])) / sum(rate(http_requests_total{namespace=\"eventplan\"}[2m]))",
              "legendFormat": "5xx"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Antal backend-pods (HPA)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"eventplan\",horizontalpodautoscaler=\"backend\"}",
              "legendFormat": "aktuellt"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"eventplan\",horizontalpodautoscaler=\"backend\"}",
              "legendFormat": "max"
            }
          ]
        },
        {
          "id": 9,
          "type": "logs",
          "title": "Loggar (backend)",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 10
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{namespace=\"eventplan\", app=\"backend\"}"
            }
          ]
        }
      ]
    }
