# Prometheus + Grafana. Installeras med:
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f kube-prometheus-stack-values.yaml
grafana:
  # Admin-login ligger i en Secret som skapas i CI (keys: admin-user, admin-password)
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Loki läggs till som datakälla i Grafana (se loki-values.yaml)
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false

  # Prometheus-datakällan får ett fast uid så att dashboarden hittar den
  sidecar:
    datasources:
      uid: prometheus
    dashboards:
      enabled: true
      label: grafana_dashboard

alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    # Plocka upp ServiceMonitors från alla namespaces, inte bara de med rätt release-label
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 7d
