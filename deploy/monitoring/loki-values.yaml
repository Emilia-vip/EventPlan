# Loggar. Installeras med:
#   helm upgrade --install loki grafana/loki -n monitoring -f loki-values.yaml
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
singleBinary:
  replicas: 1
  persistence:
    size: 5Gi
# Inga andra läges-komponenter behövs i SingleBinary-läget
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Cacher är för stora för en liten utvecklingsmiljö. Stäng av dem här (i produktion kan de slås på igen).
chunksCache:
  enabled: false
resultsCache:
  enabled: false
