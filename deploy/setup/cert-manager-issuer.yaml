# Let's Encrypt-certifikat för api.<domän> och cdn.<domän>. Kräver att cert-manager är installerat (se README).
# Byt e-postadressen till din egen.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: byt-till-din-epost@example.se
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
