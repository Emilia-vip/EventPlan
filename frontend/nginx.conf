server {
  # Port 8080 eftersom nginx-unprivileged inte får binda port 80 som icke-root
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashade filer från Vite (index-abc123.js) får cachas för evigt
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html får aldrig cachas, annars pekar användaren på gamla filer efter en deploy
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Används av Kubernetes readiness/liveness
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
